[package]
name = "tank-duckdb"
description = "DuckDB driver implementation for Tank: the Rust data layer"
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true
repository.workspace = true
categories.workspace = true

[features]
default = ["bundled"]
bundled = ["libduckdb-sys/bundled"]

[dependencies]
anyhow.workspace = true
# Pinned: DuckDB >= 1.20 surfaces streaming CAST errors before the first chunk,
# breaking the lazy per-chunk error propagation this driver relies on.
libduckdb-sys = { version = "=1.10506.0", features = ["buildtime_bindgen"] }
log.workspace = true
rust_decimal.workspace = true
tank-core.workspace = true
time.workspace = true
tokio.workspace = true
url.workspace = true
uuid.workspace = true

[dev-dependencies]
indoc.workspace = true
tank.workspace = true
tank-tests = { path = "../tank-tests" }
uuid.workspace = true

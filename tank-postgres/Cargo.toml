[package]
name = "tank-postgres"
description = "Postgres driver implementation for Tank: the Rust data layer"
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true
repository.workspace = true
categories.workspace = true

[dependencies]
anyhow.workspace = true
async-stream.workspace = true
byteorder = "1"
bytes = "1"
log.workspace = true
postgres-protocol = "0"
postgres-types = "0"
rust_decimal = { workspace = true, features = ["db-tokio-postgres"] }
rustls.workspace = true
rustls-native-certs = "0.8"
tank-core.workspace = true
time.workspace = true
tokio.workspace = true
tokio-postgres = { version = "0.7", features = ["with-time-0_3", "with-uuid-1"] }
tokio-postgres-rustls = "0.14"
url.workspace = true
uuid.workspace = true

[dev-dependencies]
indoc.workspace = true
rcgen.workspace = true
tank.workspace = true
tank-tests = { path = "../tank-tests", features = [
    "disable-glob",
    "disable-large-integers",
    "disable-lists",
    "disable-log10",
    "disable-maps",
    "disable-multiple-statements",
] }
testcontainers-modules = { version = "0", features = ["postgres"] }
tokio.workspace = true

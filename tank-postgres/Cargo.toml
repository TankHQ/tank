[package]
name = "tank-postgres"
description = "Postgres driver implementation for Tank: the Rust data layer"
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true
repository.workspace = true
categories.workspace = true

[dependencies]
anyhow.workspace = true
async-stream.workspace = true
byteorder = "1"
bytes = "1"
fallible-iterator = "0"
log.workspace = true
native-tls = { version = "0", optional = true }
postgres-protocol = "0"
postgres-types = { version = "0", features = ["with-time-0_3", "with-uuid-1"] }
rust_decimal = { workspace = true, features = ["db-tokio-postgres"] }
tank-core.workspace = true
time.workspace = true
tokio.workspace = true
tokio-native-tls = { version = "0", optional = true }
url.workspace = true
uuid.workspace = true
wtx.workspace = true

[features]
default = ["tls"]
tls = ["dep:native-tls", "dep:tokio-native-tls"]

[dev-dependencies]
rcgen.workspace = true
tank-tests = { path = "../tank-tests", features = [
    "disable-glob",
    "disable-large-integers",
    "disable-lists",
    "disable-log10",
    "disable-maps",
    "disable-multiple-statements",
] }
testcontainers-modules = { version = "0", features = ["postgres"] }
tokio.workspace = true

[package]
name = "tank-yourdb"
description = "YourDB driver implementation for Tank: the Rust data layer"
version = "0.1.0"
authors = ["your_name <email@address.com>"]
license = "Apache-2.0"
edition = "2024"
repository = "https://github.com/your_name/tank-yourdb"
categories = ["database"]

[features]
# Example: default = ["bundled"]
# Add backend-specific toggles; keep minimal.

[dependencies]
log.workspace = true
rust_decimal.workspace = true
# Replace with the client library of the database you are targeting
scylla = "1"
tank-core.workspace = true
time.workspace = true
url.workspace = true
uuid.workspace = true

[dev-dependencies]
tank-tests = { path = "../tank-tests", features = ["disable-transactions"] }
tokio.workspace = true

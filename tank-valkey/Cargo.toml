[package]
name = "tank-valkey"
description = "Valkey and Redis driver implementation for Tank: the Rust data layer"
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true
repository.workspace = true
categories.workspace = true
autotests = false

[[test]]
name = "pk_condition"

[[test]]
name = "redis"

[[test]]
name = "valkey"

[dependencies]
anyhow.workspace = true
async-stream.workspace = true
log.workspace = true
redis = { version = "1.0.4", features = [
    "aio",
    "rust_decimal",
    "tls-rustls-webpki-roots",
    "tokio-comp",
    "tokio-rustls-comp",
] }
rustls.workspace = true
tank-core.workspace = true
url.workspace = true

[dev-dependencies]
tank = { path = ".." }
tank-tests = { path = "../tank-tests", features = [
    "disable-glob",
    "disable-groups",
    "disable-intervals",
    "disable-joins",
    "disable-multiple-statements",
    "disable-ordering",
    "disable-references",
] }
testcontainers-modules = { version = "0", features = ["valkey", "redis"] }
time.workspace = true
tokio.workspace = true
uuid.workspace = true
